# NCM architecture with the released XSum schedule, so this run also calibrates the trainer against T0.
base: ../base/tokenizer.yaml
run_name: xsum_t0cap
data:
  dataset: xsum
model:
  arch: ncm
  in_vocab_size: 50304
  text_tokenizer: gpt2
  context_length: 48
  pad_id: 50257
  eos_id: 50256
  encoder_blocks: 0
  decoder_blocks: 1
  dropout: 0.1
  pre_quant_dropout: 0.25
  cascade_norm: true
  levels: [4, 6, 10, 14, 20, 26, 32, 40, 48]
  vq:
    decay: 0.99
    restart_threshold: 0.0
train:
  micro_batch: 256
  grad_accum: 1
